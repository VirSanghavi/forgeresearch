name: Orchestrator

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/orchestrator/**'
      - 'packages/terse-actors/**'
      - 'services/training-core/**'
      - '.github/workflows/orchestrator.yml'
  pull_request:
    paths:
      - 'services/orchestrator/**'
      - 'packages/terse-actors/**'
      - 'services/training-core/**'
      - '.github/workflows/orchestrator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/terse-actors/package-lock.json
            services/orchestrator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU training worker and evaluation harness
        working-directory: services/training-core
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,data,harness]'
          echo "FORGE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install actor and orchestrator dependencies
        run: |
          npm ci --prefix packages/terse-actors --no-audit --no-fund
          npm ci --prefix services/orchestrator --no-audit --no-fund
      - name: Typecheck and format
        working-directory: services/orchestrator
        run: |
          npm run check
          npm run format:check
      - name: Relay and Terse dispatch with real optimization and fault injection
        working-directory: services/orchestrator
        run: npm test
      - name: Phase 3 dispatch over the hosted Agent Relay engine
        working-directory: services/orchestrator
        env:
          # Each run creates a throwaway workspace (no account needed) and deletes it.
          FORGE_RELAY_URL: https://cast.agentrelay.com
        run: npm test -- tests/phase3.test.ts
