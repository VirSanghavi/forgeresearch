name: Command center
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'services/core/**'
      - 'services/api.py'
      - 'services/actors/**'
      - 'services/relay/**'
      - 'services/harness/**'
      - 'examples/harness/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'pyproject.toml'
      - 'services/training-core/src/**'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/command-center.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'services/core/**'
      - 'services/api.py'
      - 'services/actors/**'
      - 'services/relay/**'
      - 'services/harness/**'
      - 'examples/harness/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'pyproject.toml'
      - 'services/training-core/src/**'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/command-center.yml'
permissions:
  contents: read
concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:relay
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install 'durable-actors[cli]==0.14.0' 'fastapi==0.162.0' 'httpx==0.28.1' 'python-dotenv==1.2.4' 'pytest==9.2.0' 'ruff==0.17.3' 'modal==1.6.3' 'superserve==0.11.5' 'huggingface-hub==2.3.0'
      - run: uv pip install -e services/training-core
      - run: .venv/bin/durable-actors generate services/actors/src/actors.py --out-dir services/actors/generated
      - run: .venv/bin/ruff check services/core services/api.py services/actors/src services/harness scripts tests
      - run: .venv/bin/ruff format --check services/core services/api.py services/actors/src services/harness scripts tests
      - run: .venv/bin/python -m pytest tests -q --tb=short
