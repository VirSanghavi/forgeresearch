name: Training core

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/training-core/**'
      - '.github/workflows/training-core.yml'
  pull_request:
    paths:
      - 'services/training-core/**'
      - '.github/workflows/training-core.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        working-directory: services/training-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,data,harness,tasks]'
      - name: Lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit and real offline optimization tests
        run: python -m pytest -q
