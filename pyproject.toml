[project]
name = "forge-research-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.14.1", "transformers==5.21.0", "peft==0.21.2",
  "datasets==5.1.0", "safetensors==0.8.0", "durable-actors[cli]==0.14.0",
  "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "python-dotenv==1.2.4",
  # The training core, installed from this repo so its CLIs (forge-distill) run in a fresh clone.
  "forge-training-core[tasks]"
]
[project.optional-dependencies]
modal = ["modal==1.6.3"]
superserve = ["superserve==0.11.5"]
advanced = ["trl==1.16.0", "lm-eval[hf]==0.4.13", "numpy==2.3.4", "scipy==1.16.3", "charset-normalizer==3.4.4", "lxml==6.0.2"]
[tool.uv.sources]
forge-training-core = { path = "services/training-core", editable = true }
[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
[tool.pytest.ini_options]
pythonpath = [".", "services/actors", "services/training-core/src"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
